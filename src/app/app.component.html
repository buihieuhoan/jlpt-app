<div class="min-h-screen bg-slate-50 pb-20 text-slate-800 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100 sm:pb-0">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-900/85">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="flex shrink-0 items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white shadow-sm">あ</span>
        <span class="leading-tight">
          <span class="block text-base font-bold tracking-tight text-slate-900 dark:text-white">JLPT Master</span>
          <span class="hidden text-[11px] font-medium text-slate-500 dark:text-slate-400 sm:block">Ôn thi năng lực tiếng Nhật</span>
        </span>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden items-center gap-1 sm:flex">
        <a *ngFor="let item of navItems"
           [routerLink]="item.path"
           routerLinkActive="!bg-indigo-50 !text-indigo-700 dark:!bg-indigo-500/10 dark:!text-indigo-300"
           class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
          <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      </nav>

      <div class="flex items-center gap-2 sm:gap-3">
        <div *ngIf="userService.stats$ | async as stats" class="hidden items-center gap-3 rounded-lg bg-slate-100 px-3 py-1.5 text-sm font-semibold dark:bg-slate-800 md:flex">
          <span class="flex items-center gap-1 text-amber-600 dark:text-amber-400" title="Chuỗi ngày học liên tiếp">🔥 {{ stats.streak }}</span>
          <span class="h-4 w-px bg-slate-300 dark:bg-slate-600"></span>
          <span class="text-indigo-600 dark:text-indigo-400" title="Cấp độ (EXP)">Lv.{{ stats.level }}</span>
        </div>

        <!-- Level picker -->
        <div class="flex rounded-lg border border-slate-200 bg-slate-100 p-0.5 dark:border-slate-700 dark:bg-slate-800">
          <button *ngFor="let level of levels"
                  (click)="levelService.setLevel(level)"
                  [attr.aria-pressed]="(levelService.currentLevel$ | async) === level"
                  [ngClass]="(levelService.currentLevel$ | async) === level
                    ? 'bg-white text-indigo-700 shadow-sm dark:bg-indigo-600 dark:text-white'
                    : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white'"
                  class="rounded-md px-2 py-1 text-xs font-bold transition-all sm:px-2.5 sm:text-sm">
            {{ level }}
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
    <router-outlet></router-outlet>

    <!-- Placeholder message if no route is matched (Home) -->
    <div *ngIf="router.url === '/'" class="mt-20 text-center">
      <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-5xl">
        <span class="block">Chào mừng bạn đến với</span>
        <span class="mt-2 block text-indigo-600 dark:text-indigo-400">Hệ thống ôn thi JLPT</span>
      </h1>
      <div class="mt-8 flex justify-center gap-4">
        <a routerLink="/quiz" class="btn-primary px-8 py-3">Bắt đầu luyện</a>
        <a routerLink="/manage" class="btn-secondary px-8 py-3">Thêm từ mới</a>
      </div>
    </div>
  </main>

  <!-- Mobile bottom navigation -->
  <nav class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur dark:border-slate-800 dark:bg-slate-900/95 sm:hidden">
    <div class="grid grid-cols-3">
      <a *ngFor="let item of navItems"
         [routerLink]="item.path"
         routerLinkActive="!text-indigo-600 dark:!text-indigo-400"
         class="flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-semibold text-slate-500 dark:text-slate-400">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        {{ item.shortLabel }}
      </a>
    </div>
  </nav>
</div>
